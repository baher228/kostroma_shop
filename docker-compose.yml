name: analitika

services:
  postgres-ru:
    image: postgres:16-alpine
    container_name: analitika-postgres-ru
    restart: unless-stopped
    environment:
      POSTGRES_DB: analitika_personal
      POSTGRES_USER: analitika
      POSTGRES_PASSWORD: analitika_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_ru_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analitika -d analitika_personal"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-dubai:
    image: postgres:16-alpine
    container_name: analitika-postgres-dubai
    restart: unless-stopped
    environment:
      POSTGRES_DB: analitika_ops
      POSTGRES_USER: analitika
      POSTGRES_PASSWORD: analitika_dev_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_dubai_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analitika -d analitika_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-ru:
    build:
      context: .
      dockerfile: services/ru-backend/Dockerfile
    container_name: analitika-backend-ru
    restart: unless-stopped
    depends_on:
      postgres-ru:
        condition: service_healthy
    environment:
      SERVICE_REGION: ru
      PORT: 4000
      JWT_SECRET: localhost_dev_secret_7f4a6f9d20e34a77b4c1a092f6e18c75
      OPS_JWT_SECRET: localhost_dev_ops_secret_3a03b448c4a949ce9eb34f9fbfcb9e13
      CORS_ORIGIN: "*"
      PERSONAL_POSTGRES_HOST: postgres-ru
      PERSONAL_POSTGRES_PORT: 5432
      PERSONAL_POSTGRES_USER: analitika
      PERSONAL_POSTGRES_PASSWORD: analitika_dev_password
      PERSONAL_POSTGRES_DB: analitika_personal
      PERSONAL_POSTGRES_SSL: "false"
      TASK_PHOTO_DIR: /tmp/analitika-task-photos
      QC_ENABLED: ${QC_ENABLED:-false}
      QC_WORKER_ENABLED: ${QC_WORKER_ENABLED:-true}
      QC_POLL_INTERVAL_MS: ${QC_POLL_INTERVAL_MS:-2000}
      QC_MAX_ATTEMPTS: ${QC_MAX_ATTEMPTS:-3}
      QC_RETRY_BASE_MS: ${QC_RETRY_BASE_MS:-5000}
      QC_JOB_LEASE_MS: ${QC_JOB_LEASE_MS:-900000}
      QC_MAX_UPLOAD_BYTES: ${QC_MAX_UPLOAD_BYTES:-52428800}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET_AUDIO: ${S3_BUCKET_AUDIO:-ml-audio}
      S3_REGION: ${S3_REGION:-us-east-1}
      NEXARA_API_KEY: ${NEXARA_API_KEY:-}
      NEXARA_BASE_URL: ${NEXARA_BASE_URL:-https://api.nexara.ru/v1}
      NEXARA_MODEL: ${NEXARA_MODEL:-whisper-1}
      NEXARA_TIMEOUT_MS: ${NEXARA_TIMEOUT_MS:-600000}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2-Max}
      GIGACHAT_TIMEOUT_MS: ${GIGACHAT_TIMEOUT_MS:-120000}
      GIGACHAT_CA_BUNDLE_PATH: ${GIGACHAT_CA_BUNDLE_PATH:-}
      GIGACHAT_MAX_TRANSCRIPT_CHARS: ${GIGACHAT_MAX_TRANSCRIPT_CHARS:-100000}
      GIGACHAT_MAX_TOKENS: ${GIGACHAT_MAX_TOKENS:-4096}
      QC_QUALITY_GOOD_THRESHOLD: ${QC_QUALITY_GOOD_THRESHOLD:-80}
      QC_QUALITY_NEUTRAL_THRESHOLD: ${QC_QUALITY_NEUTRAL_THRESHOLD:-60}
    ports:
      - "4000:4000"

  backend-dubai:
    build:
      context: .
      dockerfile: services/dubai-backend/Dockerfile
    container_name: analitika-backend-dubai
    restart: unless-stopped
    env_file:
      - ./services/dubai-backend/.env
    depends_on:
      postgres-dubai:
        condition: service_healthy
    environment:
      SERVICE_REGION: dubai
      PORT: 4001
      OPS_JWT_SECRET: localhost_dev_ops_secret_3a03b448c4a949ce9eb34f9fbfcb9e13
      CORS_ORIGIN: "*"
      OPS_POSTGRES_HOST: postgres-dubai
      OPS_POSTGRES_PORT: 5432
      OPS_POSTGRES_USER: analitika
      OPS_POSTGRES_PASSWORD: analitika_dev_password
      OPS_POSTGRES_DB: analitika_ops
      OPS_POSTGRES_SSL: "false"
      R2_SIGNED_URL_TTL_SECONDS: ${R2_SIGNED_URL_TTL_SECONDS:-900}
    ports:
      - "4001:4001"
    volumes:
      - ./services/dubai-backend/secrets:/workspace/services/dubai-backend/secrets:ro

volumes:
  postgres_ru_data:
  postgres_dubai_data:
