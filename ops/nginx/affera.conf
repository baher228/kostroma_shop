# HTTP configuration for the new server. Enable HTTPS with Certbot after DNS
# and application/data migration are complete.
server {
    listen 80;
    listen [::]:80;
    server_name affera.co.uk;

    root /var/www/affera;
    index index.html;

    # Allow multipart overhead above the QC audio limit of 50 MiB.
    client_max_body_size 60m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ru/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dxb/ {
        proxy_pass http://127.0.0.1:4001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
