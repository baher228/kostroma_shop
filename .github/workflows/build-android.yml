name: Build Android apps

on:
  workflow_dispatch:
    inputs:
      profile:
        description: APK build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-android.yml'
      - 'App.tsx'
      - 'index.ts'
      - 'app.json'
      - 'app.config.js'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/**'
      - 'modules/audio-qc-vad/**'
      - 'scripts/prepare-audio-qc-vad.mjs'
      - '.npmrc'
      - 'worker-app/**'
      - 'shared/**'
      - 'assets/**'
      - 'withCleartextTraffic.js'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: expo-production
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: tablet
            directory: .
            lockfile: package-lock.json
            apk_prefix: analitika-tablet
            manifest_name: analitika-latest.json
          - key: worker
            directory: worker-app
            lockfile: worker-app/package-lock.json
            apk_prefix: analitika-fob
            manifest_name: analitika-worker-latest.json
    env:
      EXPO_WORKER_EAS_PROJECT_ID: ${{ vars.EXPO_WORKER_EAS_PROJECT_ID }}
      BUILD_PROFILE: ${{ inputs.profile || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight Android build config
        shell: bash
        run: |
          if [ "${{ matrix.key }}" = "worker" ] && [ -z "$EXPO_WORKER_EAS_PROJECT_ID" ]; then
            echo "::error::EXPO_WORKER_EAS_PROJECT_ID is not configured for the expo-production environment"
            exit 1
          fi
          if [ "$BUILD_PROFILE" != "preview" ]; then
            echo "::error::Only the preview profile produces dashboard-downloadable APK files"
            exit 1
          fi

      - name: Check Expo app config safety
        run: node scripts/check-app-config-clean.mjs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Typecheck app
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: |
          if [ "${{ matrix.key }}" = "worker" ]; then
            npm run typecheck
          else
            npm run frontend:typecheck
          fi

      - name: Generate Android project
        working-directory: ${{ matrix.directory }}
        env:
          EXPO_UPDATE_CHANNEL: ${{ env.BUILD_PROFILE }}
          EXPO_PUBLIC_RU_API_URL: https://affera.co.uk/ru
          EXPO_PUBLIC_DXB_API_URL: https://affera.co.uk/dxb
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build Android APK with Gradle
        working-directory: ${{ matrix.directory }}
        env:
          EXPO_PUBLIC_RU_API_URL: https://affera.co.uk/ru
          EXPO_PUBLIC_DXB_API_URL: https://affera.co.uk/dxb
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options=-Xmx1g
        run: |
          android/gradlew -p android :app:assembleRelease \
            -x lintVitalRelease \
            -x lintVitalAnalyzeRelease \
            -x generateReleaseLintVitalReportModel \
            -x lintVitalReportRelease \
            --no-daemon \
            --max-workers=2 \
            --console=plain \
            --stacktrace

      - name: Package APK for dashboard
        env:
          APP_KEY: ${{ matrix.key }}
          APP_DIR: ${{ matrix.directory }}
          APK_PREFIX: ${{ matrix.apk_prefix }}
          MANIFEST_NAME: ${{ matrix.manifest_name }}
        shell: bash
        run: |
          OUTPUT_DIR="apk-$APP_KEY"
          mkdir -p "$OUTPUT_DIR"
          APP_VERSION="$(node -p "require('./${APP_DIR}/app.json').expo.version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          APK_NAME="${APK_PREFIX}-v${APP_VERSION}-${SHORT_SHA}.apk"
          APK_SOURCE="${APP_DIR}/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_SOURCE"
          cp "$APK_SOURCE" "$OUTPUT_DIR/$APK_NAME"
          APP_VERSION="$APP_VERSION" APK_NAME="$APK_NAME" SHORT_SHA="$SHORT_SHA" \
            MANIFEST_NAME="$MANIFEST_NAME" OUTPUT_DIR="$OUTPUT_DIR" node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const manifest = {
            version: process.env.APP_VERSION,
            fileName: process.env.APK_NAME,
            url: `/downloads/${process.env.APK_NAME}`,
            buildSha: process.env.SHORT_SHA,
            updatedAt: new Date().toISOString(),
          };
          fs.writeFileSync(
            path.join(process.env.OUTPUT_DIR, process.env.MANIFEST_NAME),
            `${JSON.stringify(manifest, null, 2)}\n`,
          );
          NODE

      - name: Upload dashboard APK package
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-apk-${{ matrix.key }}
          path: apk-${{ matrix.key }}/
          if-no-files-found: error

  publish-dashboard-apks:
    needs: build
    runs-on: ubuntu-latest
    environment: production-dashboard
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      DASHBOARD_PATH: ${{ secrets.DASHBOARD_PATH }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
    steps:
      - name: Download both APK packages
        uses: actions/download-artifact@v4
        with:
          pattern: dashboard-apk-*
          path: apk
          merge-multiple: true

      - name: Validate combined package
        shell: bash
        run: |
          test -f apk/analitika-latest.json
          test -f apk/analitika-worker-latest.json
          test "$(find apk -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 2

      - name: Preflight dashboard publish config
        shell: bash
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY DASHBOARD_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for the production-dashboard environment"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup SSH
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            for attempt in {1..6}; do
              if ssh-keyscan -T 10 -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts; then
                break
              fi
              echo "ssh-keyscan failed; retrying in 5s ($attempt/6)"
              sleep 5
            done
            test -s ~/.ssh/known_hosts
          fi

      - name: Publish both APKs to dashboard downloads
        shell: bash
        run: |
          PORT="${SSH_PORT:-22}"
          SSH_OPTS=(-p "$PORT" -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          printf -v REMOTE_DOWNLOADS '%q' "$DASHBOARD_PATH/downloads"
          for attempt in {1..6}; do
            # shellcheck disable=SC2029
            if ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" "mkdir -p -- $REMOTE_DOWNLOADS" \
              && rsync -az --delete -e "ssh ${SSH_OPTS[*]}" apk/ "$SSH_USER@$SSH_HOST:$DASHBOARD_PATH/downloads/"; then
              exit 0
            fi
            echo "APK publish failed; retrying in 15s ($attempt/6)"
            sleep 15
          done
          echo "APK publish failed after 6 attempts" >&2
          exit 1

      - name: Smoke test both APK downloads
        if: ${{ vars.DASHBOARD_URL != '' }}
        shell: bash
        run: |
          BASE_URL="${DASHBOARD_URL%/}"
          for manifest in analitika-latest.json analitika-worker-latest.json; do
            manifest_file="$RUNNER_TEMP/$manifest"
            curl --fail --silent --show-error --max-time 20 \
              "$BASE_URL/downloads/$manifest" > "$manifest_file"
            apk_path="$(node -e "
              const fs = require('fs');
              const manifest = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
              if (typeof manifest.url !== 'string' || !manifest.url.startsWith('/downloads/') || !manifest.url.endsWith('.apk')) {
                process.exit(1);
              }
              process.stdout.write(manifest.url);
            " "$manifest_file")"
            curl --fail --silent --show-error --max-time 60 "$BASE_URL$apk_path" > /dev/null
          done
