name: Update Expo apps

on:
  workflow_dispatch:
    inputs:
      channel:
        description: EAS update channel
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      message:
        description: Optional update message
        required: false
        type: string
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/update-app.yml'
      - 'App.tsx'
      - 'index.ts'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/**'
      - 'worker-app/**'
      - 'shared/**'
      - 'assets/**'
      - 'withCleartextTraffic.js'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    environment: expo-production
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: tablet
            directory: .
            lockfile: package-lock.json
          - key: worker
            directory: worker-app
            lockfile: worker-app/package-lock.json
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_WORKER_EAS_PROJECT_ID: ${{ vars.EXPO_WORKER_EAS_PROJECT_ID }}
      UPDATE_CHANNEL: ${{ inputs.channel || 'preview' }}
      UPDATE_MESSAGE: ${{ inputs.message }}
      EXPO_PUBLIC_RU_API_URL: https://affera.co.uk/ru
      EXPO_PUBLIC_DXB_API_URL: https://affera.co.uk/dxb
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Expo configuration
        id: expo-config
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::EXPO_TOKEN is not configured for the expo-production environment"
              exit 1
            fi
            echo "::warning::EXPO_TOKEN is not configured; skipping automatic EAS update"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ matrix.key }}" = "worker" ] && [ -z "$EXPO_WORKER_EAS_PROJECT_ID" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::EXPO_WORKER_EAS_PROJECT_ID is not configured for the expo-production environment"
              exit 1
            fi
            echo "::warning::EXPO_WORKER_EAS_PROJECT_ID is not configured; skipping the FOB app update"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check Expo app config safety
        if: steps.expo-config.outputs.ready == 'true'
        run: node scripts/check-app-config-clean.mjs

      - name: Setup Node.js
        if: steps.expo-config.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Setup Expo and EAS
        if: steps.expo-config.outputs.ready == 'true'
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.expo-config.outputs.ready == 'true'
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Typecheck app
        if: steps.expo-config.outputs.ready == 'true'
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: |
          if [ "${{ matrix.key }}" = "worker" ]; then
            npm run typecheck
          else
            npm run frontend:typecheck
          fi

      - name: Publish OTA update
        if: steps.expo-config.outputs.ready == 'true'
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: |
          MESSAGE="$UPDATE_MESSAGE"
          if [ -z "$MESSAGE" ]; then
            MESSAGE="${GITHUB_SHA}"
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            CHANNELS=("$UPDATE_CHANNEL")
          else
            CHANNELS=(preview production)
          fi

          for CHANNEL in "${CHANNELS[@]}"; do
            eas branch:create "$CHANNEL" --non-interactive || true
            eas channel:create "$CHANNEL" --non-interactive || true
            eas channel:edit "$CHANNEL" --branch "$CHANNEL" --non-interactive
            eas update --branch "$CHANNEL" --message "$MESSAGE" --non-interactive
          done
