name: Bootstrap worker EAS project

on:
  workflow_dispatch:

jobs:
  init-worker-project:
    runs-on: ubuntu-latest
    environment: expo-production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Expo token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured for the expo-production environment"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker-app/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install worker dependencies
        working-directory: worker-app
        run: npm ci

      - name: Create or link worker EAS project
        id: init
        working-directory: worker-app
        shell: bash
        run: |
          eas project:init --json --non-interactive > "$RUNNER_TEMP/eas-init.json"
          cat "$RUNNER_TEMP/eas-init.json"
          PROJECT_ID="$(node - "$RUNNER_TEMP/eas-init.json" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          const raw = fs.readFileSync(file, 'utf8');
          const jsonStart = raw.search(/[{\[]/);
          const data = JSON.parse(jsonStart >= 0 ? raw.slice(jsonStart) : raw);
          const projectId =
            data?.projectId ??
            data?.id ??
            data?.project?.id ??
            data?.extra?.eas?.projectId;
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(projectId || '')) {
            console.error('Could not parse EAS project id from init output.');
            process.exit(1);
          }
          process.stdout.write(projectId);
          NODE
          )"
          echo "worker_project_id=$PROJECT_ID"
          echo "worker_project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
