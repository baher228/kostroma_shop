name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      region:
        description: Backend region to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - ru
          - dubai
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/deploy-backend.yml'
      - 'docker-compose.ru.yml'
      - 'docker-compose.dubai.yml'
      - 'services/ru-backend/**'
      - 'services/dubai-backend/**'
      - 'services/shared/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  deploy-ru:
    if: github.event_name == 'push' || inputs.region == 'all' || inputs.region == 'ru'
    runs-on: ubuntu-latest
    environment: production-ru
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      APP_PATH: ${{ secrets.APP_PATH }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      HEALTH_URL: ${{ vars.HEALTH_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight deployment config
        run: |
          missing=0
          for name in SSH_PRIVATE_KEY SSH_HOST SSH_USER APP_PATH ENV_FILE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for the production-ru environment"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup SSH
        run: |
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync project files
        run: |
          PORT="${SSH_PORT:-22}"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.expo/' \
            --exclude 'android/app/build/' \
            --exclude 'services/ru-backend/dist/' \
            --exclude 'services/dubai-backend/dist/' \
            -e "ssh -p $PORT" \
            ./ "$SSH_USER@$SSH_HOST:$APP_PATH/"

      - name: Deploy RU backend
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_PATH'"
          printf '%s' "$ENV_FILE" | ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "cd '$APP_PATH' && cat > .env && docker compose -f docker-compose.ru.yml up -d --build && docker image prune -f"

      - name: Smoke test RU backend
        if: ${{ vars.HEALTH_URL != '' }}
        run: curl --fail --silent --show-error --max-time 20 "$HEALTH_URL"

  deploy-dubai:
    if: github.event_name == 'push' || inputs.region == 'all' || inputs.region == 'dubai'
    runs-on: ubuntu-latest
    environment: production-dubai
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      APP_PATH: ${{ secrets.APP_PATH }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      HEALTH_URL: ${{ vars.HEALTH_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight deployment config
        run: |
          missing=0
          for name in SSH_PRIVATE_KEY SSH_HOST SSH_USER APP_PATH ENV_FILE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for the production-dubai environment"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup SSH
        run: |
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync project files
        run: |
          PORT="${SSH_PORT:-22}"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.expo/' \
            --exclude 'android/app/build/' \
            --exclude 'services/ru-backend/dist/' \
            --exclude 'services/dubai-backend/dist/' \
            -e "ssh -p $PORT" \
            ./ "$SSH_USER@$SSH_HOST:$APP_PATH/"

      - name: Deploy Dubai backend
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_PATH'"
          printf '%s' "$ENV_FILE" | ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "cd '$APP_PATH' && cat > .env && docker compose -f docker-compose.dubai.yml up -d --build && docker image prune -f"

      - name: Smoke test Dubai backend
        if: ${{ vars.HEALTH_URL != '' }}
        run: curl --fail --silent --show-error --max-time 20 "$HEALTH_URL"
