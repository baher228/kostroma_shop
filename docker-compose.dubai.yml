services:
  postgres-dubai:
    image: postgres:16-alpine
    container_name: kgb-postgres-dubai
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OPS_POSTGRES_DB:-kgb_ops}
      POSTGRES_USER: ${OPS_POSTGRES_USER:-kgb}
      POSTGRES_PASSWORD: ${OPS_POSTGRES_PASSWORD:?Set OPS_POSTGRES_PASSWORD}
    ports:
      - "${OPS_POSTGRES_PUBLIC_PORT:-5432}:5432"
    volumes:
      - postgres_dubai_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPS_POSTGRES_USER:-kgb} -d ${OPS_POSTGRES_DB:-kgb_ops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-dubai:
    build:
      context: ./services/dubai-backend
      dockerfile: Dockerfile
    container_name: kgb-backend-dubai
    restart: unless-stopped
    depends_on:
      postgres-dubai:
        condition: service_healthy
    environment:
      SERVICE_REGION: dubai
      PORT: 4001
      OPS_JWT_SECRET: ${OPS_JWT_SECRET:?Set OPS_JWT_SECRET}
      OPS_TOKEN_PUBLIC_KEY: ${OPS_TOKEN_PUBLIC_KEY:-}
      OPS_TOKEN_KEY_ID: ${OPS_TOKEN_KEY_ID:-ops-token-prod}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
      OPS_POSTGRES_HOST: postgres-dubai
      OPS_POSTGRES_PORT: 5432
      OPS_POSTGRES_USER: ${OPS_POSTGRES_USER:-kgb}
      OPS_POSTGRES_PASSWORD: ${OPS_POSTGRES_PASSWORD:?Set OPS_POSTGRES_PASSWORD}
      OPS_POSTGRES_DB: ${OPS_POSTGRES_DB:-kgb_ops}
      OPS_POSTGRES_SSL: "false"
    ports:
      - "${DXB_BACKEND_PUBLIC_PORT:-4001}:4001"

volumes:
  postgres_dubai_data:
