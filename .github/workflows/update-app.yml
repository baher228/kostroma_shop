name: Update Expo apps

on:
  workflow_dispatch:
    inputs:
      channel:
        description: EAS update channel
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      message:
        description: Optional update message
        required: false
        type: string
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/update-app.yml'
      - 'App.tsx'
      - 'index.ts'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/**'
      - 'worker-app/**'
      - 'shared/**'
      - 'assets/**'
      - 'withCleartextTraffic.js'

jobs:
  update:
    runs-on: ubuntu-latest
    environment: expo-production
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: tablet
            directory: .
            lockfile: package-lock.json
          - key: worker
            directory: worker-app
            lockfile: worker-app/package-lock.json
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_WORKER_EAS_PROJECT_ID: ${{ vars.EXPO_WORKER_EAS_PROJECT_ID }}
      UPDATE_CHANNEL: ${{ inputs.channel || 'preview' }}
      UPDATE_MESSAGE: ${{ inputs.message }}
      EXPO_PUBLIC_RU_API_URL: https://affera.co.uk/ru
      EXPO_PUBLIC_DXB_API_URL: https://affera.co.uk/dxb
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Expo configuration
        id: expo-config
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::EXPO_TOKEN is not configured for the expo-production environment"
              exit 1
            fi
            echo "::warning::EXPO_TOKEN is not configured; skipping automatic EAS update"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ matrix.key }}" = "worker" ] && [ -z "$EXPO_WORKER_EAS_PROJECT_ID" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::EXPO_WORKER_EAS_PROJECT_ID is not configured for the expo-production environment"
              exit 1
            fi
            echo "::warning::EXPO_WORKER_EAS_PROJECT_ID is not configured; skipping the FOB app update"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.expo-config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Setup Expo and EAS
        if: steps.expo-config.outputs.ready == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.expo-config.outputs.ready == 'true'
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Typecheck app
        if: steps.expo-config.outputs.ready == 'true'
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: |
          if [ "${{ matrix.key }}" = "worker" ]; then
            npm run typecheck
          else
            npm run frontend:typecheck
          fi

      - name: Publish OTA update
        if: steps.expo-config.outputs.ready == 'true'
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: |
          MESSAGE="$UPDATE_MESSAGE"
          if [ -z "$MESSAGE" ]; then
            MESSAGE="${GITHUB_SHA}"
          fi
          eas branch:create "$UPDATE_CHANNEL" --non-interactive || true
          eas channel:create "$UPDATE_CHANNEL" --non-interactive || true
          eas channel:edit "$UPDATE_CHANNEL" --branch "$UPDATE_CHANNEL" --non-interactive
          eas update --branch "$UPDATE_CHANNEL" --message "$MESSAGE" --non-interactive
