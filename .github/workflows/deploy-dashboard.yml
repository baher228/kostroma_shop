name: Deploy dashboard

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/deploy-dashboard.yml'
      - 'web-dashboard/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production-dashboard
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      DASHBOARD_PATH: ${{ secrets.DASHBOARD_PATH }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      VITE_RU_API_URL: ${{ vars.VITE_RU_API_URL }}
      VITE_DXB_API_URL: ${{ vars.VITE_DXB_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Preflight deployment config
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY DASHBOARD_PATH VITE_RU_API_URL VITE_DXB_API_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for the production-dashboard environment"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm --prefix web-dashboard ci

      - name: Build dashboard
        run: npm run dashboard:build

      - name: Setup SSH
        run: |
          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            for attempt in {1..6}; do
              if ssh-keyscan -T 10 -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts; then
                break
              fi
              echo "ssh-keyscan failed; retrying in 5s ($attempt/6)"
              sleep 5
            done
            test -s ~/.ssh/known_hosts
          fi

      - name: Sync dashboard files
        run: |
          PORT="${SSH_PORT:-22}"
          SSH_OPTS=(-p "$PORT" -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          printf -v REMOTE_DASHBOARD '%q' "$DASHBOARD_PATH"
          for attempt in {1..6}; do
            # shellcheck disable=SC2029
            if ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" "mkdir -p -- $REMOTE_DASHBOARD" \
              && rsync -az --delete --exclude 'downloads/' -e "ssh ${SSH_OPTS[*]}" web-dashboard/dist/ "$SSH_USER@$SSH_HOST:$DASHBOARD_PATH/"; then
              exit 0
            fi
            echo "Dashboard sync failed; retrying in 15s ($attempt/6)"
            sleep 15
          done
          echo "Dashboard sync failed after 6 attempts" >&2
          exit 1

      - name: Reload nginx
        run: |
          PORT="${SSH_PORT:-22}"
          SSH_OPTS=(-p "$PORT" -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3)
          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" "sudo -n /usr/sbin/nginx -t && sudo -n /usr/bin/systemctl reload nginx"

      - name: Smoke test dashboard
        if: ${{ vars.DASHBOARD_URL != '' }}
        run: curl --fail --silent --show-error --max-time 20 "$DASHBOARD_URL" >/dev/null
