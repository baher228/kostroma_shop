name: Update Expo app

on:
  workflow_dispatch:
    inputs:
      channel:
        description: EAS update channel
        required: true
        default: production
        type: choice
        options:
          - preview
          - production
      message:
        description: Optional update message
        required: false
        type: string
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/update-app.yml'
      - 'App.tsx'
      - 'index.ts'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/**'
      - 'assets/**'
      - 'withCleartextTraffic.js'

jobs:
  update:
    runs-on: ubuntu-latest
    environment: expo-production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      UPDATE_CHANNEL: ${{ inputs.channel || 'production' }}
      UPDATE_MESSAGE: ${{ inputs.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight Expo config
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured for the expo-production environment"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA update
        run: |
          MESSAGE="$UPDATE_MESSAGE"
          if [ -z "$MESSAGE" ]; then
            MESSAGE="${GITHUB_SHA}"
          fi
          eas update --channel "$UPDATE_CHANNEL" --message "$MESSAGE" --non-interactive
