name: Update Expo app

on:
  workflow_dispatch:
    inputs:
      channel:
        description: EAS update channel
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      message:
        description: Optional update message
        required: false
        type: string
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/update-app.yml'
      - 'App.tsx'
      - 'index.ts'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/**'
      - 'assets/**'
      - 'withCleartextTraffic.js'

jobs:
  update:
    runs-on: ubuntu-latest
    environment: expo-production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      UPDATE_CHANNEL: ${{ inputs.channel || 'preview' }}
      UPDATE_MESSAGE: ${{ inputs.message }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Expo token
        id: expo-token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::EXPO_TOKEN is not configured for the expo-production environment"
              exit 1
            fi
            echo "::warning::EXPO_TOKEN is not configured; skipping automatic EAS update for this push"
            echo "token_present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "token_present=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.expo-token.outputs.token_present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Expo and EAS
        if: steps.expo-token.outputs.token_present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.expo-token.outputs.token_present == 'true'
        run: npm ci

      - name: Publish OTA update
        if: steps.expo-token.outputs.token_present == 'true'
        run: |
          MESSAGE="$UPDATE_MESSAGE"
          if [ -z "$MESSAGE" ]; then
            MESSAGE="${GITHUB_SHA}"
          fi
          eas update --channel "$UPDATE_CHANNEL" --message "$MESSAGE" --non-interactive
