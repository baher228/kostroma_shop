name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-jwt-secret
      OPS_JWT_SECRET: ci-ops-jwt-secret
      CORS_ORIGIN: http://localhost:19006
      PERSONAL_POSTGRES_PASSWORD: ci-personal-password
      OPS_POSTGRES_PASSWORD: ci-ops-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker-app/package-lock.json
            services/ru-backend/package-lock.json
            services/dubai-backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install FOB app dependencies
        run: npm --prefix worker-app ci

      - name: Install RU backend dependencies
        run: npm --prefix services/ru-backend ci

      - name: Install Dubai backend dependencies
        run: npm --prefix services/dubai-backend ci

      - name: Install web dashboard dependencies
        run: npm --prefix web-dashboard ci

      - name: Run backend/mobile CI checks
        run: npm run ci

      - name: Validate deployment env generation
        run: node --test scripts/write-production-env.test.mjs

      - name: Check Expo app config safety
        run: npm run security:check-app-config

      - name: Bundle both Android apps
        env:
          EXPO_PUBLIC_RU_API_URL: https://affera.co.uk/ru
          EXPO_PUBLIC_DXB_API_URL: https://affera.co.uk/dxb
          EXPO_WORKER_EAS_PROJECT_ID: ${{ vars.EXPO_WORKER_EAS_PROJECT_ID }}
        shell: bash
        run: |
          npx expo export --platform android --output-dir "$RUNNER_TEMP/tablet-export"
          WORKER_PROJECT_ID="${EXPO_WORKER_EAS_PROJECT_ID:-11111111-1111-4111-8111-111111111111}"
          (
            cd worker-app
            EXPO_WORKER_EAS_PROJECT_ID="$WORKER_PROJECT_ID" \
              npx expo export --platform android --output-dir "$RUNNER_TEMP/fob-export"
          )
          test -f "$RUNNER_TEMP/tablet-export/metadata.json"
          test -f "$RUNNER_TEMP/fob-export/metadata.json"

      - name: Build web dashboard
        run: npm run dashboard:build

      - name: Build RU backend Docker image
        run: docker build -f services/ru-backend/Dockerfile -t analitika-ru-ci .

      - name: Build MinIO Docker image from pinned upstream releases
        run: docker build -f ops/minio/Dockerfile -t analitika-minio-ci .

      - name: Verify real MinIO object read/write/delete
        shell: bash
        run: |
          docker network create ai-qc-storage-ci
          trap 'docker rm -f ai-qc-storage-ci >/dev/null 2>&1 || true; docker network rm ai-qc-storage-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --rm --name ai-qc-storage-ci --network ai-qc-storage-ci --network-alias minio \
            -e MINIO_ROOT_USER=ci-minio -e MINIO_ROOT_PASSWORD=ci-minio-password \
            analitika-minio-ci server /data --console-address :9001
          for attempt in {1..20}; do
            if docker exec ai-qc-storage-ci sh -c 'mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 && mc mb --ignore-existing local/ml-audio >/dev/null 2>&1'; then
              break
            fi
            sleep 2
          done
          docker run --rm --network ai-qc-storage-ci \
            -e JWT_SECRET -e OPS_JWT_SECRET -e CORS_ORIGIN \
            -e QC_ENABLED=true -e QC_WORKER_ENABLED=false \
            -e S3_ENDPOINT_URL=http://minio:9000 -e S3_ACCESS_KEY=ci-minio \
            -e S3_SECRET_KEY=ci-minio-password -e S3_BUCKET_AUDIO=ml-audio \
            analitika-ru-ci node dist/quality-control/storagePreflight.js

      - name: Build Dubai backend Docker image
        run: docker build -f services/dubai-backend/Dockerfile -t analitika-dubai-ci .
